ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    <FilesMatch "^(home-view|admin-view|login-view|site-content|voting-library|icons)\.php$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/data/uploads>
    Options -Indexes
    Require all granted
    <FilesMatch "\.(php[0-9]?|phtml|phar|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
